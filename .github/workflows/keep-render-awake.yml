name: Keep Render Awake

on:
  schedule:
    - cron: '2/5 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render health endpoint
        run: |
          URL="https://golden-opac-backend.onrender.com/health"
          echo "Pinging $URL"
          curl -fsS --max-time 30 "$URL"