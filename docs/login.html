<!-- login.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Librarian Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
  <script>
      document.documentElement.classList.add("branding-loading");
  </script>
  <link rel="stylesheet" href="styles.css" />

  <style>
    :root{
      --glass: rgba(255,255,255,0.16);
      --glass2: rgba(255,255,255,0.10);
      --stroke: rgba(255,255,255,0.22);
      --shadow: 0 26px 60px rgba(0,0,0,0.38);

      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.72);
    }

    *{ box-sizing: border-box; }
    html,body{ height: 100%; }
    

    .login-page{
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    .wrap{
      position: relative;
      z-index: 3;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 34px 16px;
    }

    .card{
      width: min(520px, 92vw);
      border-radius: 26px;
      background: linear-gradient(135deg, var(--glass), var(--glass2));
      border: 1px solid var(--stroke);
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      box-shadow: var(--shadow);
      padding: 26px 28px 24px;
      position: relative;
      overflow: hidden;
      animation: cardIn 220ms ease both;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:-60px;
      background:
        radial-gradient(closest-side at 20% 10%, rgba(255,255,255,0.26), transparent 55%),
        radial-gradient(closest-side at 90% 30%, color-mix(in srgb, var(--brand-yellow) 18%, transparent), transparent 60%);
      pointer-events:none;
    }

    @keyframes cardIn{
      from{ opacity: 0; transform: translateY(12px) scale(0.98); }
      to{ opacity: 1; transform: translateY(0) scale(1); }
    }

    .back-row{
      display:flex;
      justify-content:flex-start;
      margin-bottom:10px;
      position: relative;
      z-index: 1;
    }

    .back-btn{
      text-decoration:none;
      font-weight:900;
      font-size:13px;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(255,255,255,0.18);
      border:1px solid rgba(255,255,255,0.25);
      color:rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      transition:transform 160ms ease, background 160ms ease;
    }

    .back-btn:hover{
      transform:translateY(-1px);
      background:rgba(255,255,255,0.28);
    }

    .back-btn:active{
      transform:translateY(1px);
    }

    .logo{
      display: grid;
      place-items: center;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }
    .logo img{
      width: 70px;
      height: 70px;
      object-fit: contain;
      filter: drop-shadow(0 10px 16px rgba(0,0,0,0.25));
    }

    .brand-copy{
      text-align: center;
      position: relative;
      z-index: 1;
      margin-bottom: 8px;
    }

    .brand-copy .brand__name{
      font-size: 17px;
      font-weight: 900;
      line-height: 1.2;
      margin: 0;
    }

    .brand-copy .brand__sub{
      font-size: 14px;
      line-height: 1.35;
      margin-top: 2px;
      font-weight: 700;
    }

    .brand__school{
      color: var(--brand-yellow);
      font-weight: 900;
    }

    .brand__subtitle{
      color: var(--brand-green);
      font-weight: 700;
    }

    .title{
      text-align: center;
      font-size: 34px;
      font-weight: 900;
      margin: 10px 0 8px;
      color: rgba(255,255,255,0.95);
      position: relative;
      z-index: 1;
    }

    .divider{
      height: 1px;
      width: 100%;
      background: rgba(255,255,255,0.18);
      margin: 18px 0 22px;
    }

    .login-progress{
      height: 6px;
      width: 100%;
      border-radius: 999px;
      background: color-mix(in srgb, var(--brand-green) 28%, transparent);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      margin: 10px 0 18px;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 180ms ease, transform 180ms ease;
      position: relative;
      z-index: 1;
    }
    .login-progress.is-on{
      opacity: 1;
      transform: translateY(0);
    }
    .login-progress__bar{
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: var(--brand-yellow);
      transition: width 180ms ease;
    }

    .form{
      display: grid;
      gap: 14px;
      position: relative;
      z-index: 1;
    }

    .field label{
      display: block;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.88);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .input-wrap{
      position: relative;
    }

    .input{
      width: 100%;
      padding: 14px 46px 14px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.20);
      background: rgba(0,0,0,0.20);
      color: rgba(255,255,255,0.92);
      outline: none;
      font-size: 15px;
      font-weight: 700;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }
    .input::placeholder{ color: rgba(255,255,255,0.55); font-weight: 600; }
    .input:focus{
      border-color: color-mix(in srgb, var(--brand-yellow) 55%, white);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand-yellow) 18%, transparent);
      background: rgba(0,0,0,0.24);
      transform: translateY(-1px);
    }

    .toggle{
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border: 0;
      padding: 0;
      cursor: pointer;
      background: transparent;
      color: rgba(255,255,255,0.9);
      display: grid;
      place-items: center;
      opacity: 0.9;
    }
    .toggle:hover{
      opacity: 1;
      transform: translateY(-50%) translateY(-1px);
    }
    .toggle:active{
      transform: translateY(-50%) translateY(1px);
    }

    .btn{
      margin-top: 10px;
      width: 160px;
      justify-self: center;
      padding: 12px 16px;
      border-radius: 999px;
      border: 0;
      cursor: pointer;
      font-weight: 900;
      letter-spacing: 0.04em;
      background: var(--brand-yellow);
      color: #111;
      box-shadow: 0 16px 34px rgba(0,0,0,0.25);
      transition: transform 170ms ease, opacity 170ms ease, filter 170ms ease, background 170ms ease;
    }
    .btn:hover{
      transform: translateY(-2px);
      opacity: 0.96;
      background: var(--brand-green);
      color: #fff;
    }
    .btn:active{ transform: translateY(1px); }
    .btn:disabled{
      cursor: not-allowed;
      opacity: 0.75;
      filter: grayscale(0.15);
      transform: none;
    }

    .hint{
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,0.62);
      line-height: 1.5;
      position: relative;
      z-index: 1;
    }

    .error{
      display:none;
      background: rgba(176,0,0,0.16);
      border: 1px solid rgba(176,0,0,0.22);
      color: rgba(255,255,255,0.92);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
      position: relative;
      z-index: 1;
    }
    .error.is-on{ display:block; }

    @media (max-width: 420px){
      .card{ padding: 22px 18px 20px; border-radius: 22px; }
      .title{ font-size: 30px; }
      .btn{ width: 100%; }
      .input{ padding-right: 44px; }
    }

    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear,
    input::-ms-reveal {
      display: none;
    }

    input[type="password"]::-webkit-credentials-auto-fill-button,
    input[type="password"]::-webkit-textfield-decoration-container {
      display: none !important;
    }
  </style>
  <link rel="stylesheet" href="mobile.css" />
</head>

<body>
  <main class="login-page">
    <div class="page-bg" aria-hidden="true"></div>
    <div class="page-overlay" aria-hidden="true"></div>

    <div class="wrap">
      <section class="card" aria-label="Librarian Login">
        <div class="back-row">
          <a href="index.html" class="back-btn" aria-label="Back to home">
            &lt;
          </a>
        </div>

        <div class="logo">
          <img src="assets/default-school-logo.png" alt="School Logo" class="brand__logo">
        </div>

        <div class="brand-copy">
          <div class="brand__name">
            <span class="brand__school" data-brand-school-name>Your School Name</span>
          </div>
          <div class="brand__sub">
            <span class="brand__subtitle" data-brand-header-subtitle>Online Public Access Catalogue</span>
          </div>
        </div>

        <h1 class="title">Login</h1>
        <div class="divider" aria-hidden="true"></div>

        <div class="login-progress" id="loginProgress" aria-hidden="true">
          <div class="login-progress__bar" id="loginProgressBar"></div>
        </div>

        <div id="err" class="error" role="alert"></div>

        <form class="form" id="loginForm" autocomplete="on">
          <div class="field">
            <label for="username">Username</label>
            <div class="input-wrap">
              <input class="input" id="username" name="username" type="text" placeholder="Enter your username" required>
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input class="input" id="password" name="password" type="password" placeholder="Enter your password" required>
              <button class="toggle" type="button" id="togglePw" aria-label="Show password">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button class="btn" type="submit" id="loginBtn">LOGIN</button>
        </form>

        <div class="hint">
          For librarian access only. If you don't have an account, contact the library administrator.
        </div>
      </section>
    </div>
  </main>

  <script>
    const BASE_URL = 'https://golden-opac-backend.onrender.com';

    const form = document.getElementById("loginForm");
    const pw = document.getElementById("password");
    const username = document.getElementById("username");
    const toggle = document.getElementById("togglePw");
    const err = document.getElementById("err");
    const loginBtn = document.getElementById("loginBtn");

    const loginProgress = document.getElementById("loginProgress");
    const loginProgressBar = document.getElementById("loginProgressBar");

    let progressInterval = null;
    let currentProgress = 0;

    function showError(message) {
      err.textContent = message;
      err.classList.add("is-on");
    }
    function clearError() {
      err.textContent = "";
      err.classList.remove("is-on");
    }

    function startProgress(){
      loginProgress.classList.add("is-on");
      currentProgress = 0;
      loginProgressBar.style.width = "0%";

      if (progressInterval) clearInterval(progressInterval);

      progressInterval = setInterval(() => {
        if (currentProgress < 85) {
          currentProgress += 3;
          loginProgressBar.style.width = currentProgress + "%";
        }
      }, 120);
    }

    function finishProgress(){
      if (progressInterval) clearInterval(progressInterval);
      progressInterval = null;
      loginProgressBar.style.width = "100%";
    }

    function stopProgress(){
      if (progressInterval) clearInterval(progressInterval);
      progressInterval = null;
      loginProgress.classList.remove("is-on");
      loginProgressBar.style.width = "0%";
    }

    async function fetchMe(token) {
      const res = await fetch(`${BASE_URL}/auth/me`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (!res.ok) throw new Error("Invalid token");
      return res.json();
    }

    toggle.addEventListener("click", () => {
      const isPw = pw.type === "password";
      pw.type = isPw ? "text" : "password";

      toggle.innerHTML = isPw
        ? `
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
            stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-6.5 0-10-7-10-7a21.72 21.72 0 0 1 5.06-6.94"/>
            <path d="M1 1l22 22"/>
        </svg>
        `
        : `
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
            stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
        </svg>
        `;
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();

      const u = (username.value || "").trim();
      const p = pw.value || "";
      if (!u || !p) return;

      loginBtn.disabled = true;
      startProgress();

      try {
        const url = `${BASE_URL}/auth/login?username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`;
        const res = await fetch(url, { method: "POST" });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          stopProgress();
          loginBtn.disabled = false;
          showError(data?.detail || "Invalid credentials. Please try again.");
          return;
        }

        const token = data?.access_token;
        if (!token) {
          stopProgress();
          loginBtn.disabled = false;
          showError("Login succeeded but no token returned.");
          return;
        }

        localStorage.setItem("token", token);
        localStorage.setItem("access_token", token);
        sessionStorage.setItem("token", token);
        sessionStorage.setItem("access_token", token);
        sessionStorage.setItem("gk_token", token);

        const me = await fetchMe(token);
        const role = String(me?.role || "librarian").toLowerCase();

        finishProgress();
        setTimeout(() => {
          window.location.href = role === "cashier" ? "cashier.html" : "home.html";
        }, 220);

      } catch (e2) {
        stopProgress();
        loginBtn.disabled = false;
        showError("Server unreachable. Make sure FastAPI is running on 127.0.0.1:8000.");
      }
    });
  </script>
 
  <script src="branding.js"></script>


</body>
</html>
